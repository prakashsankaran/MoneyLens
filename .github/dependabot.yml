version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo pins its native modules to one SDK; upgrade them together, by hand.
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*']
    ignore:
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
