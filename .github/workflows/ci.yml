name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneylens
          POSTGRES_PASSWORD: moneylens
          POSTGRES_DB: moneylens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneylens -d moneylens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mobile
      - run: npm run build
      - name: Audit runtime dependencies
        run: node scripts/audit-runtime.mjs

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneylens
          POSTGRES_PASSWORD: moneylens
          POSTGRES_DB: moneylens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneylens -d moneylens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://moneylens:moneylens@localhost:5432/moneylens?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-for-end-to-end-tests-0123456789
      CORS_ORIGINS: http://localhost:5173
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Playwright starts the API and web dev servers (npm run dev:e2e).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
