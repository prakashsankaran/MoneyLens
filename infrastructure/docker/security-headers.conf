# Security headers for the web app. Included in every location that sets its
# own add_header, because nginx does not inherit add_header into such blocks.
#
# CSP: scripts only from this origin; inline style attributes are needed by
# the chart library; the Inter font comes from Google Fonts; the API is on the
# same origin (proxied under /api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Behind a TLS-terminating proxy, also send:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
