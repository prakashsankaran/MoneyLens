# Serves the built web app and proxies /api to the API container, so the
# browser sees a single origin (the refresh cookie stays SameSite=Strict).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  include /etc/nginx/snippets/security-headers.conf;

  client_max_body_size 12m;

  # Compress the app bundle and API JSON (about a quarter of the size on the wire).
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # index.html must be revalidated so a new deploy is picked up at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
  }
}
