# MoneyLens on one internet-facing server, for you and the friends you invite.
# Step-by-step guide: docs/HOSTING.md
#
#   cd infrastructure/hosting
#   cp .env.example .env        # then fill it in
#   docker compose up -d --build
#
# Only Caddy is reachable from the internet (ports 80 and 443). It gets a free
# HTTPS certificate from Let's Encrypt and forwards to the web container,
# which serves the app and passes /api to the API. Postgres has no published
# port. A backup container writes a compressed dump every night.
name: moneylens

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneylens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: moneylens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneylens -d moneylens']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://moneylens:${POSTGRES_PASSWORD}@postgres:5432/moneylens?schema=public
      CORS_ORIGINS: https://${MONEYLENS_DOMAIN:?Set MONEYLENS_DOMAIN in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      # Caddy, then nginx in the web container, sit in front of the API.
      TRUST_PROXY: 2
      LOG_LEVEL: info
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}
      SIGNUP_INVITE_CODES: ${SIGNUP_INVITE_CODES:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_ALLOWED_EMAILS: ${AI_ALLOWED_EMAILS:-}
      AI_DAILY_MESSAGE_LIMIT: ${AI_DAILY_MESSAGE_LIMIT:-20}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: https://${MONEYLENS_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      MONEYLENS_DOMAIN: ${MONEYLENS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: moneylens
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: moneylens
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ['sh', '/usr/local/bin/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
